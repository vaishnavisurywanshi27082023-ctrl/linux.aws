<!DOCTYPE html>
<html>
<head>
    <title>AWS CodePipeline Practical</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            padding-top: 80px;
        }

        .container {
            background: white;
            width: 70%;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #ff9900;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        button {
            background-color: #ff9900;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: #e68a00;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 Hello from AWS CodePipeline!</h1>

        <p>
            My GitHub repository is connected to
            <b>AWS CodePipeline</b>.
        </p>

        <p>
            This website is automatically deployed using CI/CD.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <div id="message"></div>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "✅ CodePipeline is working successfully!";
        }
    </script>

</body>
</html>
